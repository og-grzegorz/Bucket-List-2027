<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bucket list 2027</title>
<meta name="theme-color" content="#3346E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2027">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF3;--card:#fff;--ink:#10202E;--mute:#5E6E7D;--line:#D3DCE4;--acc:#3346E0;--accInk:#fff;--sun:#F5C842;
--h:'Bricolage Grotesque',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1620;--card:#172432;--ink:#EAF0F5;--mute:#8FA1B2;--line:#26384A;--acc:#7C8CFF;--accInk:#0E1620}}
:root[data-theme="dark"]{--bg:#0E1620;--card:#172432;--ink:#EAF0F5;--mute:#8FA1B2;--line:#26384A;--acc:#7C8CFF;--accInk:#0E1620}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--b);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:800 84px/.85 var(--h);letter-spacing:-3px;margin:0;color:var(--acc)}
.sub{font:600 15px var(--b);color:var(--mute);margin:6px 0 0}
.ring{width:64px;height:64px;flex:none}
.ring text{font:800 15px var(--h);fill:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;font:600 14px var(--b);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.chip small{opacity:.7;margin-left:4px}
section{margin-top:18px}
h2{font:800 22px var(--h);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:600 13px var(--b);color:var(--mute)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.ck svg{width:16px;height:16px;stroke:var(--accInk);stroke-width:3;fill:none;opacity:0}
li.done .ck{background:var(--acc)}li.done .ck svg{opacity:1}
li.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.tag{flex:none;font:600 12px var(--b);background:var(--sun);color:#3a2d00;border-radius:99px;padding:3px 9px}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accInk);border:0;border-radius:99px;padding:15px 22px;font:800 16px var(--h);box-shadow:0 6px 18px rgba(20,30,90,.35);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(6,12,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h3{font:800 20px var(--h);margin:0}
label{font:600 13px var(--b);color:var(--mute);display:grid;gap:5px}
input,select{font:16px var(--b);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px}
.btns button{flex:1;border-radius:12px;padding:13px;font:800 15px var(--h);cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btns .pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btns .del{flex:none;color:#D0342C;border-color:#D0342C}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<main>
<header>
 <div><h1>2027</h1><p class="sub">Bucket lista</p></div>
 <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="arc" cx="32" cy="32" r="27" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" transform="rotate(-90 32 32)"/><text id="pct" x="32" y="37" text-anchor="middle">0%</text></svg>
</header>
<nav class="chips" id="chips" aria-label="Filtr"></nav>
<div id="list"></div>
</main>
<button class="fab" id="add">+ Dodaj</button>
<div class="ov" id="ov"><form class="sheet" id="f" onsubmit="return false">
 <h3 id="st">Nowe marzenie</h3>
 <label>Co chcesz zrobić?<input id="tx" maxlength="120" autocomplete="off" placeholder="np. Skok ze spadochronem"></label>
 <div class="row">
  <label>Od miesiąca<select id="fr"></select></label>
  <label>Do miesiąca<select id="to"></select></label>
 </div>
 <div class="btns"><button type="button" class="del" id="dl">Usuń</button><button type="button" id="cn">Anuluj</button><button type="button" class="pri" id="sv">Zapisz</button></div>
</form></div>
<script>
const M=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const S=['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
const K='bucket2027';let items=[],filter='all',editId=null;
try{items=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function opts(el,first){el.innerHTML='<option value="">'+first+'</option>'+M.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}
opts($('fr'),'Bez terminu (ogólne)');opts($('to'),'— tylko ten miesiąc —');
function tag(it){if(it.from==null)return'';return'<span class="tag">'+(it.to!=null&&it.to>it.from?S[it.from]+'–'+S[it.to]:S[it.from])+'</span>'}
function li(it){return`<li class="${it.done?'done':''}"><button class="ck" data-c="${it.id}" aria-label="Zrobione"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><button class="t" data-e="${it.id}">${esc(it.t)}</button>${filter==='all'?'':tag(it)}</li>`}
function block(title,arr,cnt){return`<section><h2>${title}<span>${arr.filter(x=>x.done).length}/${arr.length}</span></h2>${arr.length?'<ul>'+arr.map(li).join('')+'</ul>':'<p class="empty">Nic tu jeszcze nie ma.</p>'}</section>`}
function render(){
 const gen=items.filter(i=>i.from==null),mon=m=>items.filter(i=>i.from===m);
 let h='';
 if(filter==='all'){
  h+=block('Kiedyś w 2027',gen);
  for(let m=0;m<12;m++){const a=mon(m);if(a.length)h+=block(M[m],a)}
  if(!items.length)h='<p class="empty">Lista jest pusta. Dodaj pierwsze marzenie przyciskiem poniżej.</p>';
 }else if(filter==='gen')h=block('Kiedyś w 2027',gen);
 else h=block(M[filter],mon(filter));
 $('list').innerHTML=h;
 const c=['<button class="chip" aria-pressed="'+(filter==='all')+'" data-f="all">Wszystko</button>','<button class="chip" aria-pressed="'+(filter==='gen')+'" data-f="gen">Ogólne<small>'+gen.length+'</small></button>'];
 S.forEach((s,i)=>{const n=mon(i).length;c.push(`<button class="chip" aria-pressed="${filter===i}" data-f="${i}">${s}${n?'<small>'+n+'</small>':''}</button>`)});
 $('chips').innerHTML=c.join('');
 const d=items.filter(i=>i.done).length,p=items.length?Math.round(d/items.length*100):0;
 $('pct').textContent=p+'%';$('arc').style.strokeDashoffset=169.6*(1-p/100);
}
$('chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;const v=b.dataset.f;filter=(v==='all'||v==='gen')?v:+v;render()};
$('list').onclick=e=>{
 const c=e.target.closest('[data-c]'),t=e.target.closest('[data-e]');
 if(c){const it=items.find(x=>x.id==c.dataset.c);it.done=!it.done;save();render()}
 if(t)openSheet(t.dataset.e);
};
function openSheet(id){
 editId=id||null;const it=id?items.find(x=>x.id==id):null;
 $('st').textContent=it?'Edytuj':'Nowe marzenie';
 $('tx').value=it?it.t:'';
 const pre=(!it&&typeof filter==='number')?filter:null;
 $('fr').value=it?(it.from??''):(pre??'');
 $('to').value=it?(it.to??''):'';
 $('dl').style.display=it?'':'none';
 $('ov').classList.add('on');setTimeout(()=>$('tx').focus(),50);
}
const close=()=>$('ov').classList.remove('on');
$('add').onclick=()=>openSheet();$('cn').onclick=close;
$('ov').onclick=e=>{if(e.target.id==='ov')close()};
$('sv').onclick=()=>{
 const t=$('tx').value.trim();if(!t){$('tx').focus();return}
 let fr=$('fr').value===''?null:+$('fr').value,to=$('to').value===''?null:+$('to').value;
 if(fr==null)to=null;else if(to!=null&&to<fr){const x=fr;fr=to;to=x}
 if(editId){const it=items.find(x=>x.id==editId);Object.assign(it,{t,from:fr,to})}
 else items.push({id:Date.now(),t,from:fr,to,done:false});
 save();close();render();
};
$('dl').onclick=()=>{items=items.filter(x=>x.id!=editId);save();close();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&$('ov').classList.contains('on'))$('sv').click()});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
